name: Update HKTTA rankings

on:
  schedule:
    - cron: "30 22 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_rankings.py
      - run: python scripts/fetch_lcsd.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json data/lcsd.json
          git diff --staged --quiet || git commit -m "Update ranking and LCSD snapshots"
          git push
