name: Update ranking data

on:
  schedule:
    # GitHub Actions cron is UTC only. HKT is UTC+8 year-round.
    - cron: "30 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch HKTTA rankings
        run: python scripts/fetch_rankings.py
      - name: Fetch HKTTA ranking history
        run: python scripts/fetch_hktta_history.py
        continue-on-error: true
      - name: Fetch LCSD records
        run: python scripts/fetch_lcsd.py
        continue-on-error: true
      - name: Fetch Hang Seng badge exams
        run: python scripts/fetch_badges.py
        continue-on-error: true
      - name: Stamp unique name counts
        run: python scripts/stamp_unique_counts.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json data/lcsd.json data/lcsd_age_maps.json data/badges.json data/source_history.json data/hktta_history.json data/lcsd_extra_urls.json data/archive_state.json data/badge_miss_urls.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update HKTTA and LCSD snapshots"
          git pull --rebase origin HEAD
          git push
